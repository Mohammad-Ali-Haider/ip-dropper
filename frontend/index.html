<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <title>IP Dropper</title>
    <style>
      :root {
        --bg-dark: #121212;
        --sidebar-bg: rgba(30, 30, 30, 0.6);
        --sidebar-glass: rgba(30, 30, 30, 0.4);
        --sidebar-border: rgba(255, 255, 255, 0.1);
        --card-bg: rgba(46, 46, 46, 0.7);
        --card-bg-solid: #2E2E2E;
        --accent: rgba(58, 58, 58, 0.8);
        --accent-hover: rgba(70, 70, 70, 0.8);
        --text-light: #E0E0E0;
        --border-color: rgba(68, 68, 68, 0.5);
        --glass-border: rgba(255, 255, 255, 0.1);
        --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        --glass-glow: 0 0 15px rgba(255, 255, 255, 0.05);
        --glass-blur: 10px;
        --device-online: #51cf66;
        --device-offline: #ff6b6b;
        --drag-accent: #007bff;
        --drag-accent-rgb: 0, 123, 255;
        --drag-error: #dc3545;
        --drag-error-rgb: 220, 53, 69;
      }

      html, body {
        margin: 0;
        background-color: var(--bg-dark);
        color: var(--text-light);
        background-attachment: fixed;
      }

      @media (prefers-color-scheme: dark) {
        html, body {
          background-image: radial-gradient(circle at top right, rgba(30, 30, 30, 0.2), transparent 60%);
        }
      }

      @media (prefers-color-scheme: light) {
        html, body {
          background-image: radial-gradient(circle at top right, rgba(240, 240, 240, 0.5), transparent 60%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
